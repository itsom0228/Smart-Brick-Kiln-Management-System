# About Section
about.title=About Our Company
about.history=Company History & Journey
about.historyText=Dipak Sarpane Brick Industries was founded with a vision to deliver premium quality building materials to support construction projects of all sizes. Over the years, we have transitioned from traditional brick-making methods to automated environment-friendly kiln processes.
about.vision=Our Vision
about.visionText=To be the leading and most trusted provider of durable, cost-effective, and ecologically sustainable brick products in the region.
about.mission=Our Mission
about.missionText=To manufacture products meeting strict quality benchmarks, ensuring customer satisfaction with timely dispatch, robust infrastructure, and fair pricing.
about.ownerMessage=Message from the Founder
about.ownerTitle=Founder & Managing Director
about.ownerText=Welcome to Dipak Sarpane Brick Industries. We believe that a strong house or infrastructure is built on two things: a solid design and premium materials. Our kiln employs high-efficiency combustion systems to yield bricks with superior compressive strength, optimal weight, and resistance to weather. We promise transparency, quality, and prompt shipping.

# Why Choose Us
wcu.title=Why Choose Us
wcu.subtitle=What Sets Our Brick Kiln Apart
wcu.card1.title=Premium Quality Bricks
wcu.card1.desc=High-compressive strength bricks with uniform shapes, smooth textures, and durable properties.
wcu.card2.title=Advanced Kiln Process
wcu.card2.desc=Eco-friendly combustion technology and refined clay processing for superior brick strength.
wcu.card3.title=Timely Delivery
wcu.card3.desc=Equipped with a robust fleet of trucks to transport and dump bricks directly to your site.
wcu.card4.title=Affordable Pricing
wcu.card4.desc=Get factory-direct wholesale pricing without middleman commissions or markups.
wcu.card5.title=Trusted Business
wcu.card5.desc=A registered enterprise with thousands of satisfied contractors, builders, and homeowners.
wcu.card6.title=Customer Satisfaction
wcu.card6.desc=Dedicated customer service ready to assist with orders, estimations, and site deliveries.
wcu.card7.title=Strong Infrastructure
wcu.card7.desc=Massive stockyard capacity ensuring that high volume orders are fulfilled without supply shortages.
wcu.card8.title=Reliable Service
wcu.card8.desc=Prompt updates, easy order tracking, and transparent invoicing for all clients.

