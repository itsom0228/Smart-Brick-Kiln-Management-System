# Phase 2: Gokul Sarpane Success Story & Address
contact.officeAddress=Maharashtra, Osmanabad (Dharashiv), Tq: Paranda, Village: Hingangaon Bk, PIN: 413502
about.legacyTitle=OUR LEGACY & VALUES
about.legacySubtitle=An Empire Built on Hard Work & Trust
about.fatherStoryTitle=Father's Sacrifice, Son's Vision
about.fatherStoryText1=Every empire has a silent hero who works in the shadows, laying brick after brick of sweat and sacrifice. For Dipak Sarpane Brick Industries, that hero is Gokul Sarpane.
about.fatherStoryText2=Gokul Sarpane envisioned a legacy where his family would stand proud as industrial leaders. Starting with nothing but pure determination, clay, and calloused hands, he fought against all odds to establish the initial brick kiln. He stood the entire empire on his shoulders—carrying the weight of economic hardships, blistering summer suns, and unpredictable rainfalls—solely to secure a bright future for his son, Dipak Sarpane.
about.fatherStoryQuote="My father Gokul Sarpane laid the foundation of this company with his sweat and sacrifices. Today, we don't just sell bricks; we sell the trust, strength, and legacy that he built with his bare hands."
about.fatherStoryText3=Today, Dipak Sarpane honors his father's sacrifices by combining that traditional foundation of hard work with modern automation, dynamic logistics, and digitized management. The result is Sarpane Vit Suppliers, a state-of-the-art infrastructure providing quality building products to thousands of families across Maharashtra.
