# Phase 2: Gokul Sarpane Success Story & Address
contact.officeAddress=महाराष्ट्र, उस्मानाबाद (धाराशिव), ता: परंडा, गाव: हिंगणगाव बु., पिन: ४१३५०२
about.legacyTitle=आमचा वारसा आणि मूल्ये
about.legacySubtitle=कष्ट आणि विश्वासावर उभे राहिलेले साम्राज्य
about.fatherStoryTitle=वडिलांचे कष्ट, मुलाचे स्वप्न
about.fatherStoryText1=प्रत्येक साम्राज्याचा एक पडद्यामागील नायक असतो जो घामाच्या आणि त्यागाच्या प्रत्येक विटा रचत काम करतो. दीपक सरपणे विट उद्योगासाठी तो नायक म्हणजे गोकुळ सरपणे होय.
about.fatherStoryText2=गोकुळ सरपणे यांनी आपल्या कुटुंबाने औद्योगिक क्षेत्रात ताठ मानेने उभे राहावे यासाठी एका साम्राज्याचे स्वप्न पाहिले. हातामध्ये केवळ जिद्द, माती आणि कष्टाच्या जोरावर त्यांनी सर्व संकटांवर मात करत पहिली विटभट्टी सुरू केली. आर्थिक अडचणी, उन्हातान्हाची तमा न बाळगता आणि पावसाच्या अनिश्चिततेशी लढा देत त्यांनी आपल्या खांद्यावर संपूर्ण साम्राज्य पेलले—केवळ आपला मुलगा दीपक सरपणे याच्या उज्ज्वल भविष्यासाठी.
about.fatherStoryQuote="माझे वडील गोकुळ सरपणे यांनी आपल्या घामातून आणि त्यागातून या व्यवसायाचा पाया रचला. आज आम्ही केवळ विटा विकत नाही, तर त्यांनी आपल्या हाताने निर्माण केलेला विश्वास, ताकद आणि वारसा लोकांपर्यंत पोहोचवतो."
about.fatherStoryText3=आज दीपक सरपणे हे आधुनिक ऑटोमेशन, गतिमान लॉजिस्टिक्स आणि डिजिटल व्यवस्थापनाच्या साहाय्याने आपल्या वडिलांच्या कष्टाचा सन्मान करत आहेत. याचेच फलित म्हणजे 'सरपणे विट सप्लायर्स' आहे, जे संपूर्ण महाराष्ट्रातील हजारो कुटुंबांना दर्जेदार विटा पुरवत आहे.
