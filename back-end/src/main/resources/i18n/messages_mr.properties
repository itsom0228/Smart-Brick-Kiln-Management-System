# About Section
about.title=कंपनीबद्दल माहिती
about.history=कंपनीचा इतिहास आणि प्रवास
about.historyText=दीपक सरपाने ब्रिक इंडस्ट्रीजची स्थापना सर्व प्रकारच्या बांधकाम प्रकल्पांना दर्जेदार साहित्य पुरवण्याच्या उद्देशाने करण्यात आली. आम्ही पारंपरिक विटा बनवण्याऐवजी आता पर्यावरणपूरक स्वयंचलित भट्टी (किलन) प्रक्रियेचा अवलंब केला आहे.
about.vision=आमचे ध्येय (व्हिजन)
about.visionText=या क्षेत्रातील सर्वात विश्वासू, मजबूत आणि पर्यावरणपूरक विटा पुरवणारी अग्रगण्य कंपनी बनणे.
about.mission=आमचे उद्दिष्ट (मिशन)
about.missionText=गुणवत्तेच्या निकषांवर खरे उतरणारे उत्पादन बनवणे, वाजवी दर राखणे आणि ग्राहकांना वेळेवर विटा पोहोचवून त्यांचे समाधान करणे.
about.ownerMessage=संस्थापकाचा संदेश
about.ownerTitle=संस्थापक आणि व्यवस्थापकीय संचालक
about.ownerText=दीपक सरपाने ब्रिक इंडस्ट्रीजमध्ये आपले स्वागत आहे. मजबूत घरासाठी चांगला आराखडा आणि दर्जेदार साहित्याची आवश्यकता असते. आमच्या भट्टीत तयार होणाऱ्या विटा उच्च क्षमतेच्या आणि हवामानाला तोंड देणाऱ्या असतात. आम्ही गुणवत्ता आणि वेळेवर वितरणाचे वचन देतो.

