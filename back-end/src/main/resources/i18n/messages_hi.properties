# About Section
about.title=कंपनी के बारे में
about.history=कंपनी का इतिहास और यात्रा
about.historyText=दीपक सरपाने ब्रिक इंडस्ट्रीज की स्थापना सभी आकारों के निर्माण परियोजनाओं के लिए प्रीमियम गुणवत्ता की निर्माण सामग्री प्रदान करने के लिए की गई थी। सालों से, हम पारंपरिक तरीकों से पर्यावरण के अनुकूल स्वचालित भट्ठा (किलन) प्रणाली में परिवर्तित हुए हैं।
about.vision=हमारा विजन
about.visionText=क्षेत्र में टिकाऊ, सस्ती और पर्यावरण अनुकूल ईंटों का अग्रणी प्रदाता बनना।
about.mission=हमारा मिशन
about.missionText=उच्च गुणवत्ता वाले उत्पाद बनाना, समय पर डिलीवरी सुनिश्चित करना और उचित मूल्य निर्धारण के साथ ग्राहकों को संतुष्ट करना।
about.ownerMessage=संस्थापक का संदेश
about.ownerTitle=संस्थापक और प्रबंध निदेशक
about.ownerText=दीपक सरपाने ब्रिक इंडस्ट्रीज में आपका स्वागत है। हमारा मानना है कि एक मजबूत घर के लिए बढ़िया डिजाइन और उत्कृष्ट सामग्री की आवश्यकता होती है। हमारी भट्टी में तैयार ईंटें मौसम के अनुकूल और मजबूत होती हैं। हम गुणवत्ता और समय पर डिलीवरी का वादा करते हैं।

