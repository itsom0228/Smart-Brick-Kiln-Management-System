# Phase 2: Gokul Sarpane Success Story & Address
contact.officeAddress=महाराष्ट्र, उस्मानाबाद (धाराशिव), तह: परंडा, गाँव: हिंगणगांव बु., पिन: ४१३५०२
about.legacyTitle=हमारी विरासत और मूल्य
about.legacySubtitle=कड़ी मेहनत और विश्वास पर खड़ा किया गया साम्राज्य
about.fatherStoryTitle=पिता का संघर्ष, बेटे का दृष्टिकोण
about.fatherStoryText1=हर साम्राज्य का एक मूक नायक होता है जो परछाइयों में काम करता है, पसीने और त्याग की एक-एक ईंट रखता है। दीपक सरपणे ईंट उद्योग के लिए वह नायक गोकुल सरपणे हैं।
about.fatherStoryText2=गोकुल सरपणे ने एक ऐसी विरासत का सपना देखा था जहाँ उनका परिवार औद्योगिक नेताओं के रूप में गर्व से खड़ा हो सके। केवल दृढ़ संकल्प, मिट्टी और खुरदरे हाथों के साथ शुरुआत करते हुए, उन्होंने पहली ईंट भट्टी स्थापित करने के लिए सभी बाधाओं से लड़ाई लड़ी। उन्होंने आर्थिक तंगी, चिलचिलाती धूप और बेमौसम बारिश का सामना करते हुए अपने कंधों पर पूरे साम्राज्य को खड़ा किया—केवल अपने बेटे दीपक सरपणे के उज्ज्वल भविष्य के लिए।
about.fatherStoryQuote="मेरे पिता गोकुल सरपणे ने अपने पसीने और बलिदानों से इस कंपनी की नींव रखी। आज हम सिर्फ ईंटें नहीं बेचते; हम उस विश्वास, मजबूती और विरासत को बेचते हैं जो उन्होंने अपने हाथों से बनाई थी।"
about.fatherStoryText3=आज, दीपक सरपणे कड़ी मेहनत की उस पारंपरिक नींव को आधुनिक स्वचालन (ऑटोमेशन), गतिशील रसद और डिजिटल प्रबंधन के साथ जोड़कर अपने पिता के बलिदानों का सम्मान करते हैं। इसका परिणाम 'सरपणे ईंट सप्लायर्स' है, जो महाराष्ट्र के हजारों परिवारों को गुणवत्तापूर्ण निर्माण सामग्री प्रदान कर रहा है।
